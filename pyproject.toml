[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["custom_components", "scripts", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle
    "W",     # pycodestyle
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "ASYNC", # flake8-async
    "G",     # flake8-logging-format
    "LOG",   # flake8-logging
    "PERF",  # perflint
]
ignore = [
    # Comments quoting API messages may exceed 100 columns.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "SIM", "PERF"]
# Standalone interactive CLI script.
"scripts/**" = ["ASYNC240", "ASYNC250"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
