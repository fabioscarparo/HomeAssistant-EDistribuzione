recupera_storico:
  name: Fetch history
  description: >-
    Requests consumption (and injection for PODs with a generation plant or
    production meters) for a past period from E-Distribuzione and imports it
    (up to 365 days per run). History is not fetched automatically: repeat the
    action over consecutive ranges for longer periods.
  fields:
    device_id:
      name: Setup / POD
      description: >-
        Choose the device to fetch history for. The "E-Distribuzione" account
        device fetches all PODs of the setup; a single POD device limits the
        fetch to that POD.
      required: true
      selector:
        device:
          filter:
            integration: edistribuzione
    data_da:
      name: Start date
      description: >-
        First day of the period to fetch, as YYYY-MM-DD (for example 2026-08-01).
      required: true
      example: "2026-08-01"
      selector:
        date:
    data_a:
      name: End date
      description: >-
        Last day of the period to fetch, as YYYY-MM-DD. Data is published with a
        one-day delay, so yesterday at the latest.
      required: true
      example: "2026-08-31"
      selector:
        date:

configura_energy_dashboard:
  name: Configure Energy Dashboard
  description: >-
    Adds the statistics of all configured PODs to the Energy Dashboard based on
    each POD's role (exchange -> grid source, production -> solar source).
    Idempotent: does not overwrite or duplicate existing sources.
